version: "3.8"

services:
  cloudflare-ddns:
    image: oznu/cloudflare-ddns
    container_name: cloudflare-ddns
    environment:
      - API_TOKEN=${CF_API_TOKEN}
      - ZONE=${CF_ZONE}
      - SUBDOMAIN=${CF_SUBDOMAIN:-vpn}
      - PROXIED=false
    restart: unless-stopped

  wireguard:
    image: linuxserver/wireguard
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Asia/Ho_Chi_Minh
      - SERVERURL=${WG_SERVERURL}
      - SERVERPORT=${WG_SERVERPORT:-51820}
      - PEERS=${WG_PEERS:-3}
      - PEERDNS=${WG_PEERDNS:-8.8.8.8}
      - INTERNAL_SUBNET=${WG_INTERNAL_SUBNET:-10.13.13.0}
    volumes:
      - ${WG_CONFIG_PATH:-./wg-config}:/config
      - /lib/modules:/lib/modules
    ports:
      - "${WG_SERVERPORT:-51820}:${WG_SERVERPORT:-51820}/udp"
    restart: unless-stopped