services:
  mariadb:
    image: mariadb:11
    container_name: nextcloud_db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ${DB_DATA_PATH:-./data/db}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nextcloud_net

  redis:
    image: redis:7-alpine
    container_name: nextcloud_redis
    restart: unless-stopped
    networks:
      - nextcloud_net

  nextcloud:
    image: nextcloud:latest
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      # Chờ DB sẵn sàng, hook before-starting cần kết nối DB để chạy occ
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - TZ=Asia/Ho_Chi_Minh

      # Database
      - MYSQL_HOST=mariadb
      - MYSQL_DATABASE=${MYSQL_DATABASE:-nextcloud}
      - MYSQL_USER=${MYSQL_USER:-nextcloud}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

      # Redis
      - REDIS_HOST=redis

      # Admin account (chỉ dùng lần đầu khởi tạo)
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}

      # Trusted domains (cách nhau bằng dấu cách) - đồng bộ mỗi lần khởi động bởi hooks/before-starting
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}

      # Reverse proxy: chỉ tin header X-Forwarded-* từ dải IP Docker (cloudflared).
      # Để trống OVERWRITE_HOST / OVERWRITE_PROTOCOL để không ép mọi truy cập về domain.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.16.0.0/12}
      - OVERWRITEPROTOCOL=${OVERWRITE_PROTOCOL:-}
      - OVERWRITEHOST=${OVERWRITE_HOST:-}
      - OVERWRITECLIURL=${OVERWRITE_CLI_URL:-}

    volumes:
      - ${NEXTCLOUD_DATA_PATH:-./data/nextcloud}:/var/www/html
      - ./hooks/before-starting:/docker-entrypoint-hooks.d/before-starting:ro
    ports:
      # 9090 để không trùng cổng 8080 của Label Studio
      - "${NEXTCLOUD_PORT:-9090}:80"
    networks:
      - nextcloud_net
      - proxy

networks:
  nextcloud_net:
  proxy:
    name: proxy_net
