services:
  openproject:
    image: openproject/openproject:17
    container_name: openproject
    restart: unless-stopped

    ports:
      - "${OPENPROJECT_PORT:-8888}:80"

    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - OPENPROJECT_HOST__NAME=${OPENPROJECT_HOST_NAME:-localhost:8888}
      - OPENPROJECT_HTTPS=${OPENPROJECT_HTTPS:-false}
      - OPENPROJECT_SEED_DEMO_DATA=false

    volumes:
      - ${PGDATA_PATH:-./data/pgdata}:/var/openproject/pgdata
      - ${ASSETS_PATH:-./data/assets}:/var/openproject/assets
      - ./enterprise_token.rb:/app/app/models/enterprise_token.rb

    networks:
      - openproject-net

networks:
  openproject-net:
    driver: bridge
