services:
  openproject:
    image: openproject/openproject:17
    container_name: openproject
    restart: unless-stopped

    ports:
      - "${OPENPROJECT_PORT:-8888}:80"

    environment:
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # Domain chính (dùng cho link trong email, thông báo)
      - OPENPROJECT_HOST__NAME=${OPENPROJECT_HOST_NAME:-localhost:8888}
      # Các host khác được phép truy cập (cách nhau bằng dấu cách, không kèm cổng)
      - OPENPROJECT_ADDITIONAL__HOST__NAMES=localhost 127.0.0.1 ${HOST_IP:-127.0.0.1}
      # false để truy cập được bằng http://localhost / http://IP. Cloudflare vẫn phục vụ HTTPS cho domain.
      - OPENPROJECT_HTTPS=${OPENPROJECT_HTTPS:-false}
      - OPENPROJECT_SEED_DEMO_DATA=false

    volumes:
      - ${PGDATA_PATH:-./data/pgdata}:/var/openproject/pgdata
      - ${ASSETS_PATH:-./data/assets}:/var/openproject/assets
      - ./enterprise_token.rb:/app/app/models/enterprise_token.rb

    networks:
      - openproject-net
      - proxy

networks:
  openproject-net:
    driver: bridge
  proxy:
    name: proxy_net
