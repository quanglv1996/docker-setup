services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    # Cho phép trỏ Public Hostname tới cổng trên máy host: http://host.docker.internal:<port>
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  # Mạng dùng chung với các ứng dụng web -> trong Cloudflare trỏ thẳng http://<container>:<port>
  proxy:
    name: proxy_net
