version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: dify_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME:-dify}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE:-dify}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - ${DB_DATA_PATH:-./data/db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify_net

  redis:
    image: redis:6-alpine
    container_name: dify_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ${REDIS_DATA_PATH:-./data/redis}:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dify_net

  weaviate:
    image: semitechnologies/weaviate:1.19.0
    container_name: dify_weaviate
    restart: unless-stopped
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - DEFAULT_VECTORIZER_MODULE=none
      - CLUSTER_HOSTNAME=node1
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=${WEAVIATE_API_KEY}
      - AUTHENTICATION_APIKEY_USERS=hello@dify.ai
      - AUTHORIZATION_ADMINLIST_ENABLED=true
      - AUTHORIZATION_ADMINLIST_USERS=hello@dify.ai
    volumes:
      - ${WEAVIATE_DATA_PATH:-./data/weaviate}:/var/lib/weaviate
    networks:
      - dify_net

  sandbox:
    image: langgenius/dify-sandbox:latest
    container_name: dify_sandbox
    restart: unless-stopped
    environment:
      - API_KEY=${SANDBOX_API_KEY}
      - GIN_MODE=release
      - WORKER_TIMEOUT=15
    networks:
      - dify_net

  api:
    image: langgenius/dify-api:latest
    container_name: dify_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MODE=api
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - CONSOLE_WEB_URL=${CONSOLE_WEB_URL}
      - CONSOLE_API_URL=${CONSOLE_API_URL}
      - SERVICE_API_URL=${SERVICE_API_URL}
      - APP_WEB_URL=${APP_WEB_URL}
      - DB_USERNAME=${DB_USERNAME:-dify}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_LOCAL_PATH=/app/api/storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      - SANDBOX_HOST=sandbox
      - SANDBOX_PORT=8194
      - SANDBOX_API_KEY=${SANDBOX_API_KEY}
      - WEB_API_CORS_ALLOW_ORIGINS=*
      - CONSOLE_CORS_ALLOW_ORIGINS=*
    volumes:
      - ${API_STORAGE_PATH:-./data/storage}:/app/api/storage
    networks:
      - dify_net

  worker:
    image: langgenius/dify-api:latest
    container_name: dify_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - MODE=worker
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY}
      - DB_USERNAME=${DB_USERNAME:-dify}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:6379/1
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_LOCAL_PATH=/app/api/storage
      - VECTOR_STORE=weaviate
      - WEAVIATE_ENDPOINT=http://weaviate:8080
      - WEAVIATE_API_KEY=${WEAVIATE_API_KEY}
      - SANDBOX_HOST=sandbox
      - SANDBOX_PORT=8194
      - SANDBOX_API_KEY=${SANDBOX_API_KEY}
    volumes:
      - ${API_STORAGE_PATH:-./data/storage}:/app/api/storage
    networks:
      - dify_net

  web:
    image: langgenius/dify-web:latest
    container_name: dify_web
    restart: unless-stopped
    environment:
      - CONSOLE_API_URL=${CONSOLE_API_URL}
      - APP_API_URL=${APP_WEB_URL}
    networks:
      - dify_net

  nginx:
    image: nginx:alpine
    container_name: dify_nginx
    restart: unless-stopped
    depends_on:
      - api
      - web
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${DIFY_PORT:-80}:80"
    networks:
      - dify_net

networks:
  dify_net:
